services:
  backend:
    build:
      context: ./backend
    container_name: effective_backend
    expose:
      - "8080"
    networks:
      - effective_network

  nginx:
    image: nginx:1.28-alpine
    container_name: effective_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - effective_network

networks:
  effective_network:
